<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Internal Tools</title>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>

<style>
body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background: #eef2f6;
  color: #1f2933;
}

/* ===== HEADER ===== */
.header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 48px;
  background: #ffffff;
  border-bottom: 1px solid #e2e8f0;
  display: flex;
  align-items: center;
  padding: 0 24px;
  font-size: 14px;
  font-weight: 600;
  z-index: 10;
}

.header span {
  margin-left: 8px;
  font-weight: 400;
  color: #6b7280;
}

#app {
  padding-left: 2in;
  padding-top: calc(1in + 48px);
}

/* ===== PANEL ===== */
.panel {
  display: none;
  background: #ffffff;
  width: 620px;
  min-height: 360px;
  padding: 32px 36px;
  border-radius: 8px;
  box-shadow: 0 10px 28px rgba(0,0,0,0.08);
  
  position: relative;
  z-index: 1;
  
}

.panel.active { display: block; }

/* ===== TEXT ===== */
h2 { margin: 0 0 6px; font-size: 18px; font-weight: 600; }
.subtext { font-size: 12px; color: #5b6777; margin-bottom: 24px; }
.helper { font-size: 11px; color: #6b7280; margin-bottom: 10px; }

/* ===== MENU ===== */
.menu div {
  margin: 14px 0;
  cursor: pointer;
  font-weight: 500;
  border-bottom: 2px solid transparent;
  width: fit-content;
}
.menu div:hover { border-bottom-color: #2563eb; }

/* ===== FORM ===== */
input, textarea, select {
  width: 100%;
  padding: 8px 10px;
  margin-bottom: 14px;
  border: 1px solid #cbd5e1;
  border-radius: 4px;
  font-size: 14px;
}

input:disabled, select:disabled {
  background: #f1f5f9;
  color: #6b7280;
}

button {
  padding: 8px 14px;
  border-radius: 4px;
  border: none;
  background: #2563eb;
  color: white;
  cursor: pointer;
}

button:disabled {
  background: #cbd5e1;
  cursor: not-allowed;
}

.back {
  background: none;
  color: #2563eb;
  padding: 0;
  margin-bottom: 20px;
}

/* ===== RESULT ===== */
.result { margin-top: 16px; font-size: 14px; }
.covered { color: #15803d; font-weight: 600; }
.not-covered { color: #b91c1c; font-weight: 600; }
.loading { font-size: 13px; color: #6b7280; margin-top: 10px; }
</style>
</head>

<body>

<div class="header">
  Internal Tools <span>Internal Use Only</span>
</div>

<div id="app">

<section id="home" class="panel active">
  <h2>Tool Menu</h2>
  <p class="subtext">Select a utility</p>
  <div class="menu">
    <div onclick="navigate('coi')">COI</div>
    <div onclick="navigate('calc')">Calculator</div>
    <div onclick="navigate('coverage')">Coverage</div>
    <div onclick="navigate('defects')">Manufacturer Defects</div>
  </div>
</section>

<section id="coi" class="panel">
<button class="back" onclick="navigate('home')">← Back</button>
<h2>COI Editor</h2>

<label>Date</label>
<input id="date">

<label>Additional Insured</label>
<textarea id="description" rows="4"></textarea>

<label>Certificate Holder</label>
<textarea id="holder" rows="3"></textarea>

<button id="download" type="button">Download PDF</button>
</section>

<section id="calc" class="panel">
<button class="back" onclick="navigate('home')">← Back</button>
<h2>Reverse Markup Calculator</h2>

<input id="numberInput" type="number" placeholder="Enter amount">
<button onclick="calculateOriginal()">Submit</button>
<div id="calcResult" class="result"></div>
</section>

<section id="coverage" class="panel">
<button class="back" onclick="navigate('home')">← Back</button>
<h2>Item Coverage Search</h2>

<div id="coverageLoading" class="loading">Loading coverage data…</div>

<select id="mainCategory"></select>
<select id="subCategory" disabled></select>
<input id="searchItem" placeholder="Search item…" disabled>

<div id="result" class="result"></div>
</section>

<section id="defects" class="panel">
<button class="back" onclick="navigate('home')">← Back</button>
<h2>Manufacturer Defects</h2>

<input id="modelSearch" placeholder="Model number">
<button onclick="searchDefects()">Search</button>

<div id="defectLoading" class="loading"></div>
<div id="defectResult" class="result"></div>
</section>

</div>

<script>
function navigate(id) {
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* ===== CSV PARSER (commas safe) ===== */
function parseCSV(text) {
  const rows = [];
  let row = [];
  let cell = "";
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    const n = text[i + 1];

    if (c === '"' && inQuotes && n === '"') {
      cell += '"'; i++;
    } else if (c === '"') {
      inQuotes = !inQuotes;
    } else if (c === "," && !inQuotes) {
      row.push(cell); cell = "";
    } else if (c === "\n" && !inQuotes) {
      row.push(cell); rows.push(row);
      row = []; cell = "";
    } else {
      cell += c;
    }
  }
  row.push(cell);
  rows.push(row);
  return rows.slice(1);
}
</script>

<script>
/* ===== CALCULATOR ===== */
const numberInput = document.getElementById("numberInput");
const calcResult = document.getElementById("calcResult");

function calculateOriginal() {
  const x = parseFloat(numberInput.value);
  if (isNaN(x) || x <= 0) {
    calcResult.textContent = "Enter a valid number.";
    return;
  }

  let original;
  if (x === 20) original = 10;
  else if (x >= 300) original = x / 1.1;
  else {
    const buckets = [[1,10,2],[11,20,1.8],[21,30,1.65],[31,60,1.45],[61,99,1.4],[100,159,1.3],[160,299,1.15]];
    for (const [min,max,m] of buckets) {
      const c = x / m;
      if (c >= min && c <= max) { original = c; break; }
    }
  }

  calcResult.textContent = original
    ? `Original Part Cost: ${original.toFixed(2)}`
    : "No pricing rule matched.";
}
</script>

<script>
window.addEventListener("DOMContentLoaded", () => {
  const dateInput = document.getElementById("date");
  const descriptionInput = document.getElementById("description");
  const holderInput = document.getElementById("holder");
  const downloadBtn = document.getElementById("download");

  if (!downloadBtn) {
    alert("COI Download button not found");
    return;
  }

  downloadBtn.addEventListener("click", async () => {
    try {
      downloadBtn.disabled = true;
      downloadBtn.textContent = "Generating…";

      console.log("Fetching COI template…");

      const response = await fetch(
        "https://raw.githubusercontent.com/chuckccpuls-dotcom/COI/main/COI2.pdf"
      );

      if (!response.ok) {
        throw new Error("Failed to fetch COI PDF");
      }

      const pdfBytes = await response.arrayBuffer();

      console.log("Loading PDF…");

      const pdfDoc = await PDFLib.PDFDocument.load(pdfBytes);
      const page = pdfDoc.getPages()[0];
      const font = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);

      const fontSize = 8;
      const lineHeight = 10;

      // Date
      page.drawText(dateInput.value || "", {
        x: 530,
        y: 740,
        size: fontSize,
        font
      });

      // Additional Insured
      let y = 182;
      descriptionInput.value.split("\n").forEach(text => {
        if (text.trim()) {
          page.drawText(text, { x: 50, y, size: fontSize, font });
          y -= lineHeight;
        }
      });

      // Certificate Holder
      y = 84;
      holderInput.value.split("\n").forEach(text => {
        if (text.trim()) {
          page.drawText(text, { x: 50, y, size: fontSize, font });
          y -= lineHeight;
        }
      });

      const outputPdf = await pdfDoc.save();

      console.log("Triggering download…");

      const blob = new Blob([outputPdf], { type: "application/pdf" });
      const url = URL.createObjectURL(blob);

      const link = document.createElement("a");
      link.href = url;
      link.download = "COI Copy.pdf";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      URL.revokeObjectURL(url);

    } catch (err) {
      console.error(err);
      alert("COI generation failed. Check console for details.");
    } finally {
      downloadBtn.disabled = false;
      downloadBtn.textContent = "Download PDF";
    }
  });
});
</script>

<script>
/* ===== COVERAGE ===== */
const coverageURL =
"https://docs.google.com/spreadsheets/d/1lEFIg0YIUlRhNPyMhmXLvLMOxE0Xdc8IeYEYlL8VvAc/export?format=csv";

const mainCategory = document.getElementById("mainCategory");
const subCategory = document.getElementById("subCategory");
const searchItem = document.getElementById("searchItem");
const result = document.getElementById("result");
const coverageLoading = document.getElementById("coverageLoading");

let coverageData = [];

fetch(coverageURL).then(r=>r.text()).then(t=>{
  coverageData = parseCSV(t).map(r=>({
    main:r[0], sub:r[1], brand:r[2], item:r[3], coverage:r[4], issue:r[5]
  }));

  coverageLoading.style.display = "none";

  mainCategory.innerHTML = `<option value="">Select Main Category</option>`;
  [...new Set(coverageData.map(d=>d.main))].forEach(m=>{
    mainCategory.add(new Option(m,m));
  });
});

mainCategory.onchange = () => {
  subCategory.disabled = false;
  searchItem.disabled = true;
  result.textContent = "";

  subCategory.innerHTML = `<option value="">Select Sub Category</option>`;
  [...new Set(coverageData.filter(d=>d.main===mainCategory.value).map(d=>d.sub))]
    .forEach(s=>subCategory.add(new Option(s,s)));
};

subCategory.onchange = () => {
  searchItem.disabled = false;
  result.textContent = "";
};

searchItem.oninput = () => {
  const q = searchItem.value.toLowerCase();
  if (!q) { result.textContent = ""; return; }

  const match = coverageData.find(d =>
    d.main===mainCategory.value &&
    d.sub===subCategory.value &&
    d.item.toLowerCase().includes(q)
  );

  result.innerHTML = match
    ? `<div class="covered">Covered</div>
       <div><strong>Brand:</strong> ${match.brand}</div>
       <div><strong>Item:</strong> ${match.item}</div>
       <div><strong>Notes:</strong> ${match.issue || "N/A"}</div>`
    : `<div class="not-covered">Not Covered</div>`;
};
</script>

<script>
/* ===== DEFECTS ===== */
const defectURL =
"https://docs.google.com/spreadsheets/d/1lEFIg0YIUlRhNPyMhmXLvLMOxE0Xdc8IeYEYlL8VvAc/export?format=csv&gid=1606148883";

const modelSearch = document.getElementById("modelSearch");
const defectResult = document.getElementById("defectResult");
const defectLoading = document.getElementById("defectLoading");

let defectData = [];

fetch(defectURL).then(r=>r.text()).then(t=>{
  defectData = parseCSV(t).map(r=>({
    model:r[0], part:r[1], issue:r[2]
  }));
});

function searchDefects() {
  defectLoading.textContent = "Searching…";
  defectResult.textContent = "";

  setTimeout(()=>{
    const q = modelSearch.value.trim().toLowerCase();
    const match = defectData.find(d=>d.model?.toLowerCase()===q);

    defectLoading.textContent = "";
    defectResult.innerHTML = match
      ? `<strong>Part:</strong> ${match.part}<br><strong>Issue:</strong> ${match.issue}`
      : "No known defects or recalls found.";
  },300);
}
</script>

</body>
</html>
